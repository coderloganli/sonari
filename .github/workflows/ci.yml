name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # glib-sys reaches this workspace through the LiveKit SDK and needs the
      # pkg-config metadata, which the runner image does not carry. The Docker
      # build does not need this step: rust:bookworm already has it.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Manifest is valid
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      # The harness's own arithmetic — normalisation, edit distance,
      # percentiles, batch behaviour, clip assembly. Its dependencies are
      # already compiled by the step above, so this costs one link. Tests that
      # need credentials or a running stack skip themselves.
      - name: Test the evaluation harness
        run: cargo test -p harness

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        # The service refuses to start without real keys; validating the file
        # only needs them to be present.
        env:
          ELEVENLABS_API_KEY: validation-only
          LLM_API_KEY: validation-only
        run: docker compose config --quiet

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR index is consistent
        run: ./scripts/check-adr-index.sh
      # No figure enters a document before it has been measured (product.md
      # §Evidence). The run file the documents quote is in the repository, so
      # this is checkable without credentials or a stack.
      - name: Published figures are measured ones
        run: ./scripts/check-published-figures.sh
