[workspace]
members = [
  "crates/agent",
  "crates/api",
  "crates/app",
  "crates/auth",
  "crates/auth/console-contract",
  "crates/call/control",
  "crates/call/control/adapters",
  "crates/call/control/bot-speech",
  "crates/call/control/orchestration",
  "crates/call/execution",
  "crates/call/log-contract",
  "crates/call/rtc",
  "crates/call/rtc/control-contract",
  "crates/call/runtime-context",
  "crates/call/runtime-control",
  "crates/call/speech-contract",
  "crates/call/speech-runtime",
  "crates/call/worker",
  "crates/character-context",
  "crates/config",
  "crates/harness",
  "crates/character-context",
  "crates/observability",
  "crates/platform/postgres",
  "crates/probe",
  "crates/providers",
  "crates/shared-kernel",
  "crates/user-context",
  "crates/voice",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

# Versions are carried over from the source workspace so that extracted crates
# compile unchanged. Entries are removed as the crates that need them are dropped.
[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.8.6"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
hound = "3.5.1"
libwebrtc = "0.3.29"
livekit = "0.7.36"
livekit-api = "0.4.18"
notify = "8.2.0"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-stream = "0.1.17"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
argon2 = "0.5.3"
cargo_metadata = "0.23.1"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
syn = { version = "2.0.108", features = ["full", "visit"] }
walkdir = "2.5.0"
